name: Deploy CropCast to Firebase Hosting & Firestore

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies & build static SPA for cropcast-49e04
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ vars.VITE_FIREBASE_DATABASE_ID }}
        run: |
          npm ci
          npm run build

      - name: Configure optional custom Hosting site or Firestore database
        env:
          CUSTOM_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
          CUSTOM_DB: ${{ vars.FIREBASE_DATABASE_ID }}
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("firebase.json", "utf8"));
            if (process.env.CUSTOM_SITE && process.env.CUSTOM_SITE.trim()) {
              cfg.hosting = cfg.hosting || {};
              cfg.hosting.site = process.env.CUSTOM_SITE.trim();
              console.log("Configured Firebase Hosting site:", cfg.hosting.site);
            }
            if (process.env.CUSTOM_DB && process.env.CUSTOM_DB.trim() && process.env.CUSTOM_DB.trim() !== "(default)") {
              cfg.firestore = cfg.firestore || {};
              cfg.firestore.database = process.env.CUSTOM_DB.trim();
              console.log("Configured Firestore database:", cfg.firestore.database);
            }
            fs.writeFileSync("firebase.json", JSON.stringify(cfg, null, 2) + "\n");
          '

      - name: Deploy Firestore Rules to cropcast-49e04
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CROPCAST_49E04 }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "Missing GitHub Secret: FIREBASE_SERVICE_ACCOUNT_CROPCAST_49E04"
            exit 1
          fi
          printf '%s' "$SA_JSON" > /tmp/firebase-sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json npx --yes firebase-tools@latest deploy --only firestore:rules --project cropcast-49e04 --non-interactive
          rm -f /tmp/firebase-sa.json

      - name: Deploy Static Site to Firebase Hosting (cropcast-49e04.web.app)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CROPCAST_49E04 }}
          channelId: live
          projectId: cropcast-49e04
