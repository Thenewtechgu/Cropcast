name: Deploy CropCast to Firebase Hosting & Firestore

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies with npm
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Configure Firebase build environment
        env:
          FIREBASE_ENV_VAR: ${{ vars.FIREBASE_ENV }}
          FIREBASE_ENV_SECRET: ${{ secrets.FIREBASE_ENV }}
        run: |
          RAW_ENV="${FIREBASE_ENV_VAR:-$FIREBASE_ENV_SECRET}"
          if [ -n "$RAW_ENV" ]; then
            printf '%s\n' "$RAW_ENV" > .env
            echo "Loaded .env from single FIREBASE_ENV configuration."
          fi

      - name: Build Vite application
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ vars.VITE_FIREBASE_DATABASE_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      - name: Deploy to Firebase (Rules & Hosting)
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CROPCAST_49E04 }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "Error: FIREBASE_SERVICE_ACCOUNT_CROPCAST_49E04 secret is missing."
            exit 1
          fi
          printf '%s' "$SA_JSON" > /tmp/firebase-credentials.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-credentials.json
          npx --yes firebase-tools@latest deploy --only firestore:rules,hosting --project cropcast-49e04 --non-interactive
          rm -f /tmp/firebase-credentials.json
